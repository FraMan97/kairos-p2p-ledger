name: Build and Push Ledger to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push Ledger
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ledger
          push: true
          tags: ghcr.io/framan97/kairos-ledger:latest